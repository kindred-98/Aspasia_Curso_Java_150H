    <main class="resultados">
        <h2>Ejercicios de variables</h2>
        <p>Resultados de los cinco ejercicios de variables, mostrados dentro de tarjetas.</p>

        <script>
            function mostrarEjercicio(titulo, contenido) {
                document.write(
                    '<article class="ejercicio">' +
                        '<h3>' + titulo + '</h3>' +
                        contenido +
                    '</article>'
                );
            }

            // Ejercicio 1: guardar y mostrar datos personales.
            let nombre1 = "Laura";
            let edad1 = 25;
            let ciudad1 = "Gijón";

            mostrarEjercicio(
                "Ejercicio 1 · Datos personales",
                "<p><strong>Nombre:</strong> " + nombre1 + "</p>" +
                "<p><strong>Edad:</strong> " + edad1 + "</p>" +
                "<p><strong>Ciudad:</strong> " + ciudad1 + "</p>"
            );

            // Ejercicio 2: calcular el precio total de un producto.
            let producto2 = "Teclado";
            let precio2 = 30;
            let cantidad2 = 2;
            let total2 = precio2 * cantidad2;

            mostrarEjercicio(
                "Ejercicio 2 · Datos de un producto",
                "<p><strong>Producto:</strong> " + producto2 + "</p>" +
                "<p><strong>Precio:</strong> " + precio2 + " €</p>" +
                "<p><strong>Cantidad:</strong> " + cantidad2 + "</p>" +
                "<p><strong>Total:</strong> " + total2 + " €</p>"
            );

            // Ejercicio 3: calcular una edad aproximada.
            let nombre3 = "Ana";
            let anioNacimiento3 = 1997;
            let anioActual3 = 2026;
            let edad3 = anioActual3 - anioNacimiento3;

            mostrarEjercicio(
                "Ejercicio 3 · Cálculo de edad",
                "<p>" + nombre3 + " nació en " + anioNacimiento3 +
                " y tiene aproximadamente " + edad3 + " años.</p>"
            );

            // Ejercicio 4: aplicar un descuento a un producto.
            let producto4 = "Monitor";
            let precio4 = 200;
            let descuento4 = 15;
            let cantidadDescontada4 = precio4 * descuento4 / 100;
            let precioFinal4 = precio4 - cantidadDescontada4;

            mostrarEjercicio(
                "Ejercicio 4 · Precio con descuento",
                "<p><strong>Producto:</strong> " + producto4 + "</p>" +
                "<p><strong>Precio:</strong> " + precio4 + " €</p>" +
                "<p><strong>Descuento:</strong> " + descuento4 + " %</p>" +
                "<p><strong>Cantidad descontada:</strong> " + cantidadDescontada4 + " €</p>" +
                "<p><strong>Precio final:</strong> " + precioFinal4 + " €</p>"
            );

            // Ejercicio 5: calcular una compra con descuento y envío.
            let producto5 = "Portátil";
            let precio5 = 650;
            let cantidad5 = 2;
            let descuento5 = 10;
            let gastosEnvio5 = 15;
            let subtotal5 = precio5 * cantidad5;
            let cantidadDescontada5 = subtotal5 * descuento5 / 100;
            let precioConDescuento5 = subtotal5 - cantidadDescontada5;
            let precioFinal5 = precioConDescuento5 + gastosEnvio5;

            mostrarEjercicio(
                "Ejercicio 5 · Compra completa",
                "<p><strong>Producto:</strong> " + producto5 + "</p>" +
                "<p><strong>Precio unidad:</strong> " + precio5 + " €</p>" +
                "<p><strong>Cantidad:</strong> " + cantidad5 + "</p>" +
                "<p><strong>Subtotal:</strong> " + subtotal5 + " €</p>" +
                "<p><strong>Descuento:</strong> " + descuento5 + " %</p>" +
                "<p><strong>Descuento aplicado:</strong> " + cantidadDescontada5 + " €</p>" +
                "<p><strong>Gastos de envío:</strong> " + gastosEnvio5 + " €</p>" +
                "<p><strong>Total:</strong> " + precioFinal5 + " €</p>"
            );
        </script>
    </main>
