    <main class="resultados">
        <h2>Ejercicios de funciones</h2>
        <p>Práctica de funciones, parámetros y valores de retorno.</p>

        <script>
            function mostrarEjercicio(titulo, contenido) {
                document.write(
                    '<article class="ejercicio">' +
                        '<h3>' + titulo + '</h3>' +
                        contenido +
                    '</article>'
                );
            }

            // Ejercicio 1: función sin parámetros.
            function saludar() {
                return "Hola, bienvenido a JavaScript.";
            }

            mostrarEjercicio(
                "Ejercicio 1 · Saludar",
                "<p>" + saludar() + "</p>"
            );

            // Ejercicio 2: función con un parámetro.
            function mostrarNombre(nombre) {
                return "Hola " + nombre + ".";
            }

            mostrarEjercicio(
                "Ejercicio 2 · Mostrar un nombre",
                "<p>" + mostrarNombre("Patricia") + "</p>"
            );

            // Ejercicio 3: función con dos parámetros.
            function sumar(num1, num2) {
                return num1 + num2;
            }

            mostrarEjercicio(
                "Ejercicio 3 · Sumar dos números",
                "<p>El resultado de 5 + 10 es <strong>" + sumar(5, 10) + "</strong>.</p>"
            );

            // Ejercicio 4: calcular el doble de un número.
            function calcularDoble(numero) {
                return numero * 2;
            }

            mostrarEjercicio(
                "Ejercicio 4 · Calcular el doble",
                "<p>El doble de 5 es <strong>" + calcularDoble(5) + "</strong>.</p>"
            );

            // Ejercicio 5: calcular el precio total de una compra.
            function calcularPrecioTotal(precio, cantidad) {
                return precio * cantidad;
            }

            let precio = 10;
            let cantidad = 5;
            let total = calcularPrecioTotal(precio, cantidad);

            mostrarEjercicio(
                "Ejercicio 5 · Calcular el precio total",
                "<p><strong>Precio:</strong> " + precio + " €</p>" +
                "<p><strong>Cantidad:</strong> " + cantidad + "</p>" +
                "<p><strong>Total:</strong> " + total + " €</p>"
            );
        </script>
    </main>
