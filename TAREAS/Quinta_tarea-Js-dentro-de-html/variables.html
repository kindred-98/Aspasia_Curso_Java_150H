        <h1>Variables y tipos de datos</h1>
        <p>Quinta tarea · JavaScript dentro del HTML</p>
    </header>

    <nav class="nav" aria-label="Navegación de la tarea">
        <a href="variables.html" class="activo">Variables</a>
        <a href="bucles.html">Bucles y condicionales</a>

    <main class="resultados">
        <h2>Ejercicios de variables</h2>
        <p>Resultados de los ejercicios sobre let, const, tipos de datos, typeof y ámbito.</p>

        <script>
            function mostrarEjercicio(titulo, contenido) {
                document.write(
                    '<article class="ejercicio">' +
                        '<h3>' + titulo + '</h3>' +
                        contenido +
                    '</article>'
                );
            }

            // Ejercicio 1: declarar una variable con let y cambiar su valor.
            let edadInicial = 49;
            console.log("Edad inicial:", edadInicial);
            mostrarEjercicio(
                "Ejercicio 1 · Variable con let",
                "<p>Valor inicial de edad: <strong>" + edadInicial + "</strong></p>"
            );

            edadInicial = 45;
            console.log("Edad actualizada:", edadInicial);
            mostrarEjercicio(
                "Ejercicio 1 · Actualizar la variable",
                "<p>Valor actualizado de edad: <strong>" + edadInicial + "</strong></p>"
            );

            // Ejercicio 2: declarar variables de distintos tipos.
            let esEstudiante = true;
            let promedio = 8.5;
            let apellido = "Pérez";
            console.log("Estudiante:", esEstudiante, "Promedio:", promedio, "Apellido:", apellido);

            mostrarEjercicio(
                "Ejercicio 2 · Tipos de dato",
                "<p><strong>¿Es estudiante?</strong> " + esEstudiante + " · boolean</p>" +
                "<p><strong>Promedio:</strong> " + promedio + " · number</p>" +
                "<p><strong>Apellido:</strong> " + apellido + " · string</p>"
            );

            // Ejercicio 3: declarar una constante.
            const PI = 3.14159;
            console.log("PI:", PI);
            mostrarEjercicio(
                "Ejercicio 3 · Constante PI",
                "<p>El valor de PI es <strong>" + PI + "</strong>. Una constante no se puede reasignar.</p>"
            );

            // Ejercicio 4: crear valores de varios tipos y comprobarlos con typeof.
            let nombre = "Ana";
            let edad = 45;
            let altura = 1.75;
            let tieneCarnet = true;
            let datoSinDefinir;
            let datoVacio = null;
            let lenguajes = ["HTML", "CSS", "JavaScript"];
            let persona = {
                nombre: "María",
                edad: 12
            };

            console.log(
                "Nombre:", nombre, "- Tipo:", typeof nombre,
                "\nEdad:", edad, "- Tipo:", typeof edad,
                "\nAltura:", altura, "- Tipo:", typeof altura,
                "\nTiene carnet:", tieneCarnet, "- Tipo:", typeof tieneCarnet,
                "\nDato sin definir:", datoSinDefinir, "- Tipo:", typeof datoSinDefinir,
                "\nDato vacío:", datoVacio, "- Tipo:", typeof datoVacio,
                "\nLenguajes:", lenguajes, "- Tipo:", typeof lenguajes,
                "\nPersona:", persona, "- Tipo:", typeof persona
            );

            mostrarEjercicio(
                "Ejercicio 4 · Variables y typeof",
                "<p><strong>Nombre:</strong> " + nombre + " · " + typeof nombre + "</p>" +
                "<p><strong>Edad:</strong> " + edad + " · " + typeof edad + "</p>" +
                "<p><strong>Altura:</strong> " + altura + " · " + typeof altura + "</p>" +
                "<p><strong>Tiene carnet:</strong> " + tieneCarnet + " · " + typeof tieneCarnet + "</p>" +
                "<p><strong>Sin definir:</strong> " + datoSinDefinir + " · " + typeof datoSinDefinir + "</p>" +
                "<p><strong>Valor null:</strong> " + datoVacio + " · " + typeof datoVacio + "</p>" +
                "<p><strong>Lenguajes:</strong> " + lenguajes.join(", ") + " · " + typeof lenguajes + "</p>" +
                "<p><strong>Persona:</strong> " + persona.nombre + ", " + persona.edad + " años · " + typeof persona + "</p>"
            );

            // Ejercicio 5: mostrar el ámbito local de una variable.
            function miFuncion() {
                let mensaje = "Hola dentro de la función";
                console.log(mensaje);
                return mensaje;
            }

            mostrarEjercicio(
                "Ejercicio 5 · Ámbito de una variable",
                "<p>La variable local solo está disponible dentro de la función: <strong>" +
                miFuncion() + "</strong>.</p>"
            );
        </script>
    </main>
